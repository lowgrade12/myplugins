services:
  stash-bridge:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 2.0
    environment:
      BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      STASH_API_KEY_FILE: /run/secrets/stash_api_key
      STASH_URL: ${STASH_URL:-http://stash:9999}
      MEDIA_ROOT: /media
      MEDIA_PATH_MAP: ${MEDIA_PATH_MAP:-}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      ENABLE_VISUAL: ${ENABLE_VISUAL:-false}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    secrets:
      - bridge_token
      - stash_api_key
    volumes:
      - type: bind
        source: ${STASH_MEDIA_DIR:?Set STASH_MEDIA_DIR to your host media directory}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    networks:
      - stash-tools
    # No host port: Open WebUI accesses http://stash-bridge:8000 on the shared network.

secrets:
  bridge_token:
    file: ${BRIDGE_TOKEN_PATH:?Set BRIDGE_TOKEN_PATH to a readable secret file}
  stash_api_key:
    file: ${STASH_API_KEY_PATH:?Set STASH_API_KEY_PATH to a readable secret file}

networks:
  stash-tools:
    name: ${STASH_TOOLS_NETWORK:-stash-tools}
    external: true
