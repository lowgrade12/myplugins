name: Whisparr Update
description: Add matched StashDB scene to Whisparr on update
version: 0.11
exec:
  - python
  - "{pluginDir}/whisparrUpdate.py"
interface: raw

hooks:
  - name: Add on scene update
    triggeredBy:
      - Scene.Update.Post

settings:
  WHISPARR_URL:
    displayName: Whisparr URL
    type: STRING
  WHISPARR_API_KEY:
    displayName: Whisparr API Key
    type: STRING
  STASHDB_ENDPOINT_SUBSTR:
    displayName: StashDB host match (e.g. stashdb.org)
    description: Only change this if whisparr adds custom stashbox support
    type: STRING
  MONITORED:
    displayName: Monitor after add
    description: Mark the scene as monitored when synced. When off, scenes already in Whisparr are set to unmonitored too
    type: BOOLEAN
  REMOVE_ON_MATCH:
    displayName: Remove from Whisparr once matched
    description: When a scene is matched in Stash, remove it from Whisparr (files are kept) and add an import exclusion so lists don't re-add it. Overrides "Monitor after add"
    type: BOOLEAN
