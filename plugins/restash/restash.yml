name: Restash
description: Computes a freshness score for scenes and performers into custom fields.
version: 0.9.1
url: https://github.com/lowgrade12/myplugins
exec:
  - python
  - "{pluginDir}/restash.py"
interface: raw
# "Not in your library" on performer pages (restash-ui.js, missing.py)
ui:
  javascript:
    - restash-ui.js
  css:
    - restash-ui.css
settings:
  tasteHalfLifeDays:    { displayName: Taste half-life (days), type: NUMBER, description: "How fast older watch events fade when building taste. Leave blank for the default (120)." }
  cooldownDays:         { displayName: Cooldown period (days), type: NUMBER, description: "Post-watch suppression window before rediscovery begins. Leave blank for the default (14)." }
  freshWeight:          { displayName: Freshness strength, type: NUMBER, description: "Multiplier on the cooldown/rediscovery effect. Leave blank for the default (0.8)." }
  rediscoveryMaxDays:   { displayName: Rediscovery max days, type: NUMBER, description: "Days after cooldown where rediscovery bonus reaches its cap. Leave blank for the default (180)." }
  directHalfLifeDays:   { displayName: Direct-evidence half-life (days), type: NUMBER, description: "How long per-scene direct watch evidence lasts. Leave blank for the default (540)." }
  wildcardCount:        { displayName: Wildcard count, type: NUMBER, description: "How many low-confidence scenes are promoted as wildcards each day. 0 turns wildcards off. Leave blank for the default (20)." }
  wildcardTopRank:      { displayName: Wildcard placement rank, type: NUMBER, description: "Wildcards take the scores of the real scenes ranked just below this many, so they surface near the top at any library size. Leave blank for the default (50)." }
  wildcardPoolLow:      { displayName: Wildcard pool low percentile, type: NUMBER, description: "Lower percentile bound for wildcard candidates. Leave blank for the default (0.40)." }
  wildcardPoolHigh:     { displayName: Wildcard pool high percentile, type: NUMBER, description: "Upper percentile bound for wildcard candidates. Leave blank for the default (0.70)." }
  perfScenesShrinkageK: { displayName: Performer scene shrinkage K, type: NUMBER, description: "Smoothing strength toward population prior for performers with sparse scene history. Leave blank for the default (5)." }
  perfWeightScenes:     { displayName: "Performer weight: scenes", type: NUMBER, description: "Weight of top scored scenes in performer rank blend. Leave blank for the default (0.40)." }
  perfWeightAffinity:   { displayName: "Performer weight: affinity", type: NUMBER, description: "Weight of performer affinity term in performer rank blend. Leave blank for the default (0.20)." }
  perfWeightFresh:      { displayName: "Performer weight: freshness", type: NUMBER, description: "Weight of performer recency/rediscovery term in performer rank blend. Leave blank for the default (0.15)." }
  perfWeightSupply:     { displayName: "Performer weight: unwatched supply", type: NUMBER, description: "Weight of unwatched supply term in performer rank blend. Leave blank for the default (0.15)." }
  perfWeightNovelty:    { displayName: "Performer weight: novelty", type: NUMBER, description: "Weight of performer novelty term in performer rank blend. Leave blank for the default (0.10)." }
  ratingModelWeight:    { displayName: Rating model weight, type: NUMBER, description: "Share (0–1) of each scene's taste term taken from a model fitted to your own scene ratings. Used only once it predicts held-out ratings better than your average; the Dry Run Report shows how well. 0 turns it off. Leave blank for the default (1)." }
  respectManualRatings: { displayName: Blend manual ratings as a taste prior, type: BOOLEAN, description: "If on, a performer's manual rating100 nudges their affinity (read-only). Default off." }
  excludeTagName:       { displayName: Exclusion tag name, type: STRING, description: "Entities carrying this tag are dropped from scoring. Leave blank for the default ([Restash: Exclude])." }
  mirrorToRating100:    { displayName: "Also mirror score to rating100 (destructive)", type: BOOLEAN, description: "If on, each entity's Restash score is ALSO written to native rating100 (enables the in-app 'Rating, descending' sort). OVERWRITES manual ratings; a backup is auto-created first and can be reverted with 'Restore Ratings'. Default off." }
  disablePluginsBeforeRun: { displayName: "Disable other plugins before run", type: BOOLEAN, description: "If on, all other enabled plugins will be disabled before Restash runs, then re-enabled after. Prevents interference from other plugins during scoring. Default off." }
  jitterPeriodDays:     { displayName: Jitter period (days), type: NUMBER, description: "How often the small random ordering jitter is re-rolled. Longer periods mean far fewer score writes between re-rolls; 1 re-rolls daily. Leave blank for the default (7)." }
  hideMissingRow:       { displayName: "Hide 'Not in your library' on performer pages", type: BOOLEAN, description: "Off (default): performer pages list the performer's StashDB scenes you don't have, ranked by the score Restash would give them, with a Whisparr button when Whisparr Update is enabled. Needs a StashDB stash-box with an API key." }
  minScoreChange:       { displayName: Minimum score change to write, type: NUMBER, description: "Skip writing a score unless it moved by at least this many points (wildcard changes always write). Cuts write volume and other plugins' update hooks; 1 writes every change. Leave blank for the default (3)." }
tasks:
  - name: Dry Run Report
    description: Full compute, writes nothing, logs top-30 scenes/performers with score breakdowns. Run this first.
    defaultArgs: { mode: dry }
  - name: Recompute All
    description: Read everything, rebuild the taste model, and write freshness scores to scenes + performers (custom_fields). Skips unchanged.
    defaultArgs: { mode: full }
  - name: Quick Refresh
    description: Daily re-score of every scene and performer from live watch data against the cached taste model (affinities are not rebuilt). New plays and new scenes count immediately. Run Recompute All at least once first.
    defaultArgs: { mode: refresh }
  - name: Clear Restash Data
    description: Remove all Restash custom fields (restash_*) from scenes + performers. Other fields and ratings are left untouched.
    defaultArgs: { mode: clear }
  - name: Backup Ratings
    description: Snapshot every scene/performer's current native rating100 to a file in the plugin folder. Run before enabling the rating100 mirror; keeps timestamped history.
    defaultArgs: { mode: backup-ratings }
  - name: Restore Ratings
    description: Write the backed-up native rating100 values back from the file, reverting the library to the exact backup snapshot (undoes a rating100 mirror).
    defaultArgs: { mode: restore-ratings }
  - name: Disable Other Plugins
    description: Temporarily disable all other enabled plugins. They are re-enabled when the next Dry Run, Recompute All or Quick Refresh finishes.
    defaultArgs: { mode: disable-plugins }
hooks:
  - name: Score new scenes and performers
    description: Scores a newly created scene (and re-scores its performers) or a newly created performer against the cached taste model. Targeted reads and writes only; no library re-read.
    triggeredBy:
      - Scene.Create.Post
      - Performer.Create.Post
