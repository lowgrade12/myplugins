name: Stash Performer Validator
description: "Checks every local performer's StashDB (stashdb.org) ID against the live StashDB API to find performers that have been deleted, merged into another performer, or marked deleted/inactive. Other stash-box endpoints (e.g. theporndb.net) are not queried. Flags affected performers with a [StashDB: Needs Review] tag and logs a summary report."
version: 0.3
url: https://github.com/lowgrade12/myplugins
exec:
  - python
  - "{pluginDir}/stashPerformerValidator.py"
interface: raw
settings:
  tagFlagged:
    displayName: Tag flagged performers
    description: "When enabled, adds a [StashDB: Needs Review] tag to any performer with a deleted or merged stash-box ID. Disable to only produce a log report."
    type: BOOLEAN
  removeTagWhenResolved:
    displayName: Remove tag once resolved
    description: "When enabled, removes the [StashDB: Needs Review] tag from performers that are found to be valid again (e.g. after you fix their stash_id)."
    type: BOOLEAN

tasks:
  - name: "Check Performers"
    description: Query StashDB and check every local performer's stash_ids for deleted/merged/invalid status
    defaultArgs:
      mode: checkPerformers
