name: Quick Scan & Identify
description: Run a selective scan followed by identify for either of two configured directories.
version: 1.0.0
url: https://github.com/lowgrade12/myplugins
settings:
  directoryA:
    displayName: Directory A
    description: First directory path as seen by Stash.
    type: STRING
  directoryB:
    displayName: Directory B
    description: Second directory path as seen by Stash.
    type: STRING
exec:
  - python
  - "{pluginDir}/quickScanIdentify.py"
interface: raw
tasks:
  - name: Scan and Identify Directory A
    description: Selectively scan Directory A, wait for completion, then identify it.
    defaultArgs:
      mode: directory_a
  - name: Scan and Identify Directory B
    description: Selectively scan Directory B, wait for completion, then identify it.
    defaultArgs:
      mode: directory_b
